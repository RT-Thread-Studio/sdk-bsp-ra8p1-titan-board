# SDK 文档构建模板配置文件
# 复制此文件为 config.yaml 并根据项目需求修改

# ============================================================================
# 项目基本信息配置
# ============================================================================
project:
  name: "Your_SDK_Docs"                    # 修改为你的SDK文档名称
  title: "Your SDK 文档"                    # 修改为你的SDK文档标题
  description: "Your SDK 提供了丰富的示例项目，包括基础功能、驱动示例和组件示例。"  # 修改描述
  version: "0.0.1"                         # 修改版本号
  author: "your_name"                      # 修改作者
  copyright: "2025, your_company"          # 修改版权信息
  language: "zh_CN"                        # 支持的语言 (zh_CN/en)

# ============================================================================
# 仓库配置
# ============================================================================
repository:
  name: "your-sdk-repo"                    # 修改为你的GitHub仓库名称
  projects_dir: "../projects"                  # 项目目录路径 (相对于source目录)
  docs_dir: "."                            # 文档输出目录 (通常保持为".")

# ============================================================================
# 文档分类配置 - 根据你的项目调整分类和模式
# ============================================================================
categories:
  # 基础功能示例
  start:
    name: "快速上手篇"
    description: "快速上手示例"
    patterns:
      - "your_template_*"                     # 修改为你的基础项目命名模式

  basic:
    name: "基础篇"
    description: "基础功能示例"
    patterns:
      - "your_basic_*"                     # 修改为你的基础项目命名模式
      - "your_blink_led"                   # 例如: my_sdk_basic_*, my_sdk_blink_led
      - "your_factory"                     # 例如: my_sdk_factory
  
  # 驱动示例
  driver:
    name: "驱动篇"
    description: "外设驱动示例"
    patterns:
      - "your_driver_*"                    # 修改为你的驱动项目命名模式
      - "your_usb_*"                       # 例如: my_sdk_driver_*, my_sdk_usb_*
  
  # 组件示例
  component:
    name: "组件篇"
    description: "网络组件示例"
    patterns:
      - "your_component_*"                 # 修改为你的组件项目命名模式
      # 例如: my_sdk_component_*
  
  # 工业协议示例
  protocol:
    name: "工业协议篇"
    description: "工业协议示例"
    patterns:
      - "your_ethercat_*"                  # 修改为你的协议项目命名模式
      - "your_modbus_*"                    # 例如: my_sdk_ethercat_*, my_sdk_modbus_*
      - "your_profinet_*"                  # 例如: my_sdk_profinet_*
      - "your_ethernetip_*"                # 例如: my_sdk_ethernetip_*
      - "your_ethernet"                    # 例如: my_sdk_ethernet

# ============================================================================
# 文档生成配置
# ============================================================================
generation:
  # 兼容旧配置；新项目应通过 discovery/navigation 分别控制收录范围和导航
  mode: "directory_tree"

  # 文档树模式：递归同步 projects 下受支持的文档和资源
  discovery:
    mode: "recursive_tree"

  # 按源目录组织导航
  navigation:
    mode: "directory_tree"
    order:
      - "start"
      - "basic"
      - "driver"
      - "component"
      - "protocol"

  # 优先通过 projects 根 README 识别语言；projects 根目录没有时，
  # 同时检查仓库根 README 与各文档目录，仓库根 README 也作为网站首页回退来源
  language_detection:
    zh: "README_zh.md"
    en: "README.md"
  default_language: "zh"

  # PDF 版式：word 为项目默认样式，thesis 为研究生论文预览规范
  pdf_style: "web"

  # Use the exact font families installed by the local/CI PDF environment.
  # The build fails when one is missing; there is no silent fallback.
  pdf_fonts:
    latin: "TeX Gyre Termes"
    cjk_body: "FandolSong-Regular.otf"
    cjk_heading: "FandolHei-Regular.otf"
    cjk_emphasis: "FandolKai-Regular.otf"
    code: "Source Code Pro"

  # 相对于 repository.projects_dir 的各语言网站默认页面
  # 文件不存在时复制仓库根目录同语言 README；仍不存在才自动生成首页
  default_page:
    zh: "README_zh.md"
    en: "README.md"

  # 每个目录的各语言首页；不存在时自动生成对应语言的 index
  directory_index:
    zh: "README_zh.md"
    en: "README.md"

  # directory_tree 模式下同步的文档和资源类型
  sync_extensions:
    - ".md"
    - ".rst"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".svg"
    - ".webp"

  # 以下 copy_files/copy_dirs 保留用于兼容旧模板配置
  # 要复制的文件列表
  copy_files:
    - "README.md"                          # 英文README
    - "README_zh.md"                       # 中文README
    # 可以根据需要添加其他文件
    # - "LICENSE"
    # - "CHANGELOG.md"
  
  # 要复制的目录列表
  copy_dirs:
    - "figures"                            # 图片目录
    # 可以根据需要添加其他目录
    # - "docs"
    # - "examples"
  
  # 旧版排序键，保留用于兼容早期模板；新配置使用 navigation.order
  output_structure:
    - "start"
    - "basic"
    - "driver"
    - "component"
    - "protocol"

# ============================================================================
# Sphinx 配置
# ============================================================================
sphinx:
  theme: "sphinx_rtd_theme"               # 文档主题
  extensions:
    - "myst_parser"                        # Markdown支持
    # 可以根据需要添加其他扩展
    # - "sphinx.ext.autodoc"
    # - "sphinx.ext.viewcode"
  
  # 支持的文件格式
  source_suffix:
    ".rst": "restructuredtext"
    ".md": "markdown"
  
  # MyST扩展配置
  myst_extensions:
    - "colon_fence"                        # 代码块支持
    - "deflist"                           # 定义列表
    - "dollarmath"                        # 数学公式
    - "html_image"                        # HTML图片
    - "html_admonition"                   # HTML警告框
    - "replacements"                      # 替换
    - "smartquotes"                       # 智能引号
    - "strikethrough"                     # 删除线
    - "substitution"                      # 替换
    - "tasklist"                          # 任务列表

# ============================================================================
# 快速迁移指南
# ============================================================================
# 1. 复制此文件为 config.yaml
# 2. 修改 project 部分的所有字段
# 3. 修改 repository.name 为你的仓库名
# 4. directory_tree 模式下，让 categories 键名与 projects 下的文档目录一致
# 5. 设置 language_detection、default_page、directory_index 和 output_structure
# 6. 运行 python build_local.py --clean 生成文档
