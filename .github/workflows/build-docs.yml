name: Build Documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'source/**'
      - '.github/versions.json'
      - 'project/**'
  pull_request:
    paths:
      - 'source/**'
      - '.github/versions.json'
      - 'project/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd source
          python -m pip install -r requirements.txt

      - name: Validate version configuration
        run: |
          cd source
          python build.py --validate

  build-docs:
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd source
          python -m pip install -r requirements.txt

      - name: Install fonts and locale support
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese fonts-texgyre fonts-dejavu-core \
            fontconfig curl \
            locales
          # Ubuntu 24.04 no longer ships fonts-adobe-source-code-pro under a
          # stable apt package name. Download the upstream TTFs through the
          # jsDelivr mirror instead.
          SOURCE_CODE_PRO_MIRROR="${SOURCE_CODE_PRO_MIRROR:-https://cdn.jsdelivr.net/gh/adobe-fonts/source-code-pro@release/TTF}"
          sudo install -d /usr/local/share/fonts/source-code-pro
          for font in SourceCodePro-Regular.ttf SourceCodePro-Bold.ttf SourceCodePro-It.ttf SourceCodePro-BoldIt.ttf; do
            sudo curl --fail --location --retry 3 --silent --show-error \
              "${SOURCE_CODE_PRO_MIRROR}/${font}" \
              --output "/usr/local/share/fonts/source-code-pro/${font}"
          done
          # 生成中英文locale
          sudo locale-gen zh_CN.UTF-8
          sudo locale-gen zh_CN.GBK
          sudo locale-gen en_US.UTF-8
          sudo locale-gen en_GB.UTF-8
          sudo fc-cache -f -v || true

      - name: Verify PDF toolchain
        run: |
          python3 -c "from PIL import Image; print('Pillow:', Image.__version__)"
          cd source
          python utils/pdf_environment.py --no-auto-install

      - name: Verify locale support
        run: |
          echo "=== 验证locale支持 ==="
          echo "可用的locale列表:"
          locale -a | grep -E "(zh|en)" || echo "警告: 未找到中英文locale"
          echo "当前LANG: $LANG"
          echo "当前LC_ALL: $LC_ALL"
          echo "=== 测试中文locale ==="
          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8
          echo "中文LANG: $LANG"
          echo "中文LC_ALL: $LC_ALL"
          python3 -c "import locale; print('中文Python locale:', locale.getlocale())"
          echo "=== 测试英文locale ==="
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          echo "英文LANG: $LANG"
          echo "英文LC_ALL: $LC_ALL"
          python3 -c "import locale; print('英文Python locale:', locale.getlocale())"
          
      - name: List version configurations
        run: |
          cd source
          echo "=== 版本配置列表 ==="
          python utils/version_utils.py --list

      - name: Build all versions
        run: |
          cd source
          echo "=== 构建环境信息 ==="
          echo "LANG: $LANG"
          echo "LC_ALL: $LC_ALL"
          echo "LC_CTYPE: $LC_CTYPE"
          echo "可用的locale:"
          locale -a | grep -E "(zh|en)" | head -10
          python3 -c "import locale; print('Python locale:', locale.getlocale())"
          echo "=== 开始构建 ==="
          echo "注意: 构建管理器将分别为中英文设置正确的locale环境变量"
          # 不设置全局locale，让构建管理器自己控制
          python build.py --clean

      - name: Verify Pages entry files
        run: |
          test -f source/source_build/html/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("source/source_build/html")
          versions = json.loads(Path(".github/versions.json").read_text(encoding="utf-8"))["versions"]
          missing = []
          for version in versions:
              entry = root / version["url_path"] / "index.html"
              if not entry.is_file():
                  missing.append(str(entry))
          if missing:
              raise SystemExit("Missing Pages entry files: " + ", ".join(missing))
          print("Pages entries verified:")
          print(root / "index.html")
          for version in versions:
              print(root / version["url_path"] / "index.html")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: source/source_build/html
          retention-days: 30

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: source/source_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: source/source_build/html
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
